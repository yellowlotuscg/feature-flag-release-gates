# Repository settings are documented as code; apply them in GitHub Settings.
branch_protection:
  branch: main
  required_status_checks:
    strict: true
    contexts:
      - build-test
      - policy
      - gitleaks
      - deny-list
      - bicep-build
      - python-audit
  required_pull_request_reviews:
    required_approving_reviews: 1
    require_code_owner_reviews: true
    dismiss_stale_reviews: true
  enforce_admins: true
  required_linear_history: true
  allow_force_pushes: false
  allow_deletions: false
  merge_queue:
    enabled: true
    merge_method: squash

environments:
  - name: staging
    required_reviewers: []
    wait_timer_minutes: 0
  - name: production
    required_reviewers:
      - release-manager
    wait_timer_minutes: 15
    deployment_branch_policy:
      protected_branches: true
      custom_branch_policies: false
